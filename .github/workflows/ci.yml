name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: golang:1.26-bookworm@sha256:79ecd0a7157c7a4cf3b281ced8465350591bf54fedab540e75374a003e1fde7e
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Кэш модулей и сборки Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Форматирование gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt -l нашёл неформатированные файлы:"
            echo "$out"
            exit 1
          fi
          echo "gofmt: чисто"

      - name: Проверка go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Юнит-тесты
        run: go test -race ./...

      - name: Checkout хоста CLIProxyAPI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 85225381d89915595598ed13766cd79890c03a84  # v8.1.2
          path: host

      - name: Сборка хоста
        run: mkdir -p host-bin && cd host && CGO_ENABLED=1 go build -o ../host-bin/CLIProxyAPI ./cmd/server

      - name: Сборка плагина
        run: make build-in-container

      - name: Интеграционный тест
        shell: bash
        env:
          CLIPROXY_BIN: ${{ github.workspace }}/host-bin/CLIProxyAPI
          GIGACODE_PLUGIN_SO: ${{ github.workspace }}/dist/gigacode.so
        run: |
          go test -tags=integration -count=1 -v ./integration/ 2>&1 | tee integration-test.log

      - name: Маскирование секретов в логе интеграционного теста
        if: failure()
        run: |
          if [ -f integration-test.log ]; then
            sed -E -i \
              -e 's/jwt-token-[0-9]+/<токен>/g' \
              -e 's/[0-9a-f]{64}/<hex64>/g' \
              -e 's/client-key-for-integration/<ключ>/g' \
              -e 's/management-key-for-integration/<ключ>/g' \
              integration-test.log
          fi

      - name: Вывод интеграционного теста при сбое
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-log
          path: integration-test.log
          if-no-files-found: ignore
          retention-days: 7
